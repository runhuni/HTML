<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iconify Badges</title>

    <!-- Iconify CDN 스크립트 연결 -->
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

    <link rel="stylesheet" href="../../Setting/reset.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="nav-bar">
      <!-- 1. 홈 아이콘 -->
      <div class="icon-box">
        <span class="iconify" data-icon="material-symbols:home-rounded"></span>
      </div>

      <!-- 2. 하트 아이콘 (알림 5) -->
      <div class="icon-box">
        <span class="iconify" data-icon="solar:heart-linear"></span>
        <span class="badge">5</span>
      </div>

      <!-- 3. 종이비행기/DM 아이콘 (알림 12) -->
      <div class="icon-box">
        <span class="iconify" data-icon="fluent:send-24-regular"></span>
        <span class="badge">12</span>
      </div>
    </div>
  </body>
</html>
