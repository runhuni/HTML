<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 4개의 박스를 감싸는 컨테이너 */
      .container {
        position: relative;
        width: 600px;
        height: 600px;
      }

      /* 공통 박스 스타일 */
      .box {
        position: absolute;
        width: 300px;
        height: 300px;
        font-size: 20px;
        font-weight: bold;
        padding: 10px;
      }

      /* 각 영역별 위치 및 색상 지정 */
      .blue {
        top: 0;
        left: 0;
        background-color: #00b4d8;
      }

      .green {
        top: 0;
        left: 300px; /* 또는 right: 0; */
        background-color: #0a9396;
      }

      .red {
        top: 300px; /* 또는 bottom: 0; */
        left: 0;
        background-color: #e76f51;
      }

      .yellow {
        top: 300px; /* 또는 bottom: 0; */
        left: 300px; /* 또는 right: 0; */
        background-color: #f4d35e;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box blue">파랑</div>
      <div class="box green">초록</div>
      <div class="box red">빨강</div>
      <div class="box yellow">노랑</div>
    </div>
  </body>
</html>
