<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>차가 필요할 땐, 쏘카</title>

    <!-- 로컬 CSS 파일 정상 연결 -->
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./header.css" />
    <link rel="stylesheet" href="./reservation.css" />
    <link rel="stylesheet" href="./promotion.css" />
  </head>
  <body>
    <!-- 1. GNB 헤더 -->
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <a class="logo-link" href="/">
            <img
              src="https://www.socar.kr/_next/static/media/logo-pc.f9a75156.svg"
              alt="socar logo"
              width="101"
              height="22"
            />
          </a>
          <nav class="nav-menu">
            <a href="#" class="active">예약하기</a>
            <a href="#">쏘카 서비스</a>
            <a href="#">블로그</a>
          </nav>
        </div>

        <div class="header-right">
          <a href="#" class="login-btn">로그인</a>
        </div>
      </div>
    </header>

    <!-- 2. 예약 섹션 -->
    <section class="reservation">
      <div class="contents">
        <h1 class="title">차가 필요할 땐, 쏘카</h1>

        <div class="search">
          <!-- 달력/시간 -->
          <div class="calendar">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0078FF"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <path d="m9 16 2 2 4-4"></path>
            </svg>
            <span class="date-text">오늘 14:30 ~ 18:30</span>
          </div>

          <!-- 검색창 -->
          <div class="search-bar">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0078FF"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.5" y1="16.5" x2="21.5" y2="21.5"></line>
            </svg>
            <input type="text" placeholder="대여 장소 검색" />
          </div>

          <!-- 검색 버튼 -->
          <button type="button">검색</button>
        </div>
      </div>
    </section>

    <!-- 3. 제주 프로모션 섹션 -->
    <section class="promotion">
      <div class="contents">
        <div class="promotion-header">
          <div class="title-group">
            <h2 class="title">제주 렌터카도 쏘카인 이유</h2>
            <p class="desc">
              카셰어링의 편리함은 그대로. 더욱 특별한 제주만의 경험과 혜택까지!
            </p>
          </div>
          <button class="nav-arrow" type="button" aria-label="다음 보기">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#4b525f"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- 카드 그리드 -->
        <div class="card-grid">
          <!-- 카드 1 (활성화 파란 테두리) -->
          <!-- 첫 번째 카드에서 active 제거 -->
          <article class="card">
            <div class="thumb-wrap">
              <img
                src="https://www.socar.kr/_next/image?url=%2Fassets%2Fimages%2Fjeju%2Fstress-free.jpg&w=3840&q=75"
                alt="항공편부터 차량까지 [완전보장]"
              />
            </div>
            <div class="card-info">
              <h3 class="card-title">항공편부터 차량까지 [완전보장]</h3>
              <p class="card-desc">
                결항·지연 시 100% 환불 및 무상 연장, 사고 시 자기부담금 0원
              </p>
            </div>
          </article>

          <!-- 카드 2 -->
          <article class="card">
            <div class="thumb-wrap">
              <img
                src="https://www.socar.kr/_next/image?url=%2Fassets%2Fimages%2Fjeju%2Fev.jpg&w=3840&q=75"
                alt="전기차 주행요금 무료"
              />
            </div>
            <div class="card-info">
              <h3 class="card-title">전기차 주행요금 무료</h3>
              <p class="card-desc">
                주행요금 없이 대여료만 내면 끝! 충전비 0원
              </p>
            </div>
          </article>

          <!-- 카드 3 -->
          <article class="card">
            <div class="thumb-wrap">
              <img
                src="https://www.socar.kr/_next/image?url=%2Fassets%2Fimages%2Fjeju%2Fterminal.jpg&w=3840&q=75"
                alt="프리미엄 라운지, 쏘카터미널"
              />
            </div>
            <div class="card-info">
              <h3 class="card-title">프리미엄 라운지, 쏘카터미널</h3>
              <p class="card-desc">
                공항-터미널 전용 무료 셔틀 5분 · 프리미엄 라운지
              </p>
            </div>
          </article>

          <!-- 카드 4 -->
          <article class="card">
            <div class="thumb-wrap">
              <img
                src="https://www.socar.kr/_next/image?url=%2Fassets%2Fimages%2Fjeju%2Fcare.jpg&w=3840&q=75"
                alt="블랙라벨 프리미엄 케어"
              />
            </div>
            <div class="card-info">
              <h3 class="card-title">블랙라벨 프리미엄 케어</h3>
              <p class="card-desc">전문 정비사 상시 점검 및 세차 기본</p>
            </div>
          </article>
        </div>
      </div>
    </section>
  </body>
</html>
